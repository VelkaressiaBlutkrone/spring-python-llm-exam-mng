services:
  mysql:
    image: mysql:8.0
    container_name: llm-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: llm_db
      MYSQL_USER: llm_admin
      MYSQL_PASSWORD: llm_password
    ports:
      - "3307:3306"
    volumes:
      - llm_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:1.5.4
    container_name: llm-chromadb
    ports:
      - "8100:8000"
    volumes:
      - llm_chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  llm_mysql_data:
  llm_chroma_data:
