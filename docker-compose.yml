services:
  mysql:
    image: mysql:8.0
    container_name: llm-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: llm_db
      MYSQL_USER: llm_admin
      MYSQL_PASSWORD: llm_password
    ports:
      - "0.0.0.0:3307:3306"
    volumes:
      - llm_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:1.5.4
    container_name: llm-chromadb
    ports:
      - "0.0.0.0:8100:8000"
    volumes:
      - llm_chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-llm:
    build:
      context: ./python-llm
      dockerfile: Dockerfile
    container_name: llm-python
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - LLM_BACKEND=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DB=llm_db
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - USE_VECTOR_SEARCH=true
    depends_on:
      mysql:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  spring-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-spring
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/llm_db
      - SPRING_DATASOURCE_USERNAME=llm_admin
      - SPRING_DATASOURCE_PASSWORD=llm_password
      - LLM_SERVICE_URL=http://python-llm:8000
    depends_on:
      mysql:
        condition: service_healthy
      python-llm:
        condition: service_started

volumes:
  llm_mysql_data:
  llm_chroma_data:
