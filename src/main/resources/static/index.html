<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM 의료 서비스</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hub-container {
            max-width: 700px;
            width: 100%;
            padding: 24px 16px;
        }
        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #1a73e8;
            font-size: 1.8rem;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 15px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .hub-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .hub-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .hub-card-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 16px;
        }
        .hub-card-icon.medical {
            background: #e8f0fe;
            color: #1a73e8;
        }
        .hub-card-icon.chat {
            background: #e6f4ea;
            color: #1e8e3e;
        }
        .hub-card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .hub-card-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }
        @media (max-width: 500px) {
            .card-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="hub-container">
        <h1>LLM 의료 서비스</h1>
        <p class="subtitle">AI 기반 의료 상담 및 병원 규칙 안내 서비스</p>

        <div class="card-grid">
            <a href="/medical.html" class="hub-card">
                <div class="hub-card-icon medical">&#x1F3E5;</div>
                <div class="hub-card-title">질병 Q&A</div>
                <div class="hub-card-desc">증상을 입력하면 AI가 추천 진료과와 의사 목록을 안내합니다.</div>
            </a>

            <a href="/chat.html" class="hub-card">
                <div class="hub-card-icon chat">&#x1F4CB;</div>
                <div class="hub-card-title">의학지식 / 병원규칙</div>
                <div class="hub-card-desc">병원 내부 규칙, 당직, 물품, 위생 등에 대해 AI에게 질문하세요.</div>
            </a>
        </div>
    </div>
</body>
</html>
