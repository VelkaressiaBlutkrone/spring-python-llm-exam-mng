spring:
  application:
    name: spring_llm_sample_mng
  datasource:
    url: jdbc:mysql://localhost:3307/llm_db
    username: ${MYSQL_USER:llm_admin}
    password: ${MYSQL_PASSWORD:llm_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update  # 개발: update, 운영: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Python LLM 서버 설정
llm:
  service:
    url: ${LLM_SERVICE_URL:http://localhost:8000}
    timeout:
      connect: 5000   # ms
      read: 120000    # ms (LLM 추론 시간 고려, Ollama 7B 모델 기준)

spring.mvc:
  async:
    request-timeout: 120000  # ms (LLM 추론 대기 2분)

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8081}

logging:
  level:
    root: INFO
    com.sample.llm: DEBUG
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
