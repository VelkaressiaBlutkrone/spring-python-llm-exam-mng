spring:
  application:
    name: spring_llm_sample_mng
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/llm_db?allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:llm_admin}
    password: ${MYSQL_PASSWORD:llm_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update  # 개발: update, 운영: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Python LLM 서버 설정
llm:
  service:
    url: ${LLM_SERVICE_URL:http://localhost:8000}
    timeout:
      connect: 5000   # ms
      read: 60000     # ms (LLM 추론 시간 고려)

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.sample.llm: DEBUG
    org.hibernate.SQL: DEBUG
